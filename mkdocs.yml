site_name: QUANTAURA-Core
site_description: Agent Execution Authorization Kernel — control plane for AI agents
repo_url: https://github.com/perseverancesworld-web/QUANTAURA-Core
repo_name: perseverancesworld-web/QUANTAURA-Core

theme:
  name: material
  palette:
    - scheme: default
      primary: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.sections
    - navigation.expand
    - search.suggest
    - search.highlight

nav:
  - Home: index.md
  - Quickstart: quickstart.md
  - Kernel: kernel.md
  - Architecture: architecture.md
  - Integrations: integrations.md
  - API: api.md
  - Commercial: commercial.md
  - Contributing: contributing.md

markdown_extensions:
  - admonition
  - codehilite
  - toc:
      permalink: true
