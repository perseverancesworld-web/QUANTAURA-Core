name: CI

on:
  push:
    branches: [main, master, dev]
  pull_request:
    branches: [main, master, dev]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v5

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libsodium-dev build-essential

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install package
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -e ".[dev]"

      - name: Smoke import
        run: |
          python -c "import quantaura; print('version', quantaura.__version__)"
          python -c "from quantaura.crypto.signatures import generate_keypair; print('crypto', generate_keypair()[1][:8])"
          python -c "from quantaura.api.main import app; print('routes', len(app.routes))"

      - name: Run pytest
        run: python -m pytest -v --tb=short
