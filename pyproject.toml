[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "quantaura-core"
version = "0.2.0"
description = "Agent Execution Authorization Kernel — cryptographic intent signing, policy evaluation, multi-party approvals, and durable audit before any side effect."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
  { name = "Joshua Privett", email = "joshua@perseverances.world" }
]
keywords = [
  "agent-authorization",
  "ai-agents",
  "control-plane",
  "policy",
  "intent",
  "ed25519",
  "langchain",
  "governance",
  "audit",
  "multi-party-approval",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Information Technology",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Security",
  "Topic :: Software Development :: Libraries",
]

dependencies = [
  "fastapi>=0.100.0",
  "uvicorn[standard]>=0.20.0",
  "pydantic>=2.0.0",
  "pynacl>=1.5.0",
  "httpx>=0.27.0",
  "numpy>=1.26.0",
  "pandas>=2.2.0",
]

[project.optional-dependencies]
dev = [
  "black>=24.0.0",
  "pytest>=8.0.0",
  "pytest-asyncio>=0.23.0",
  "mkdocs-material>=9.0.0",
  "ruff>=0.9.0",
]
langchain = [
  "langchain-core>=0.2.0",
]
postgres = [
  "psycopg[binary]>=3.1.0",
]

[project.scripts]
quantaura-serve = "quantaura.api.main:cli_serve"

[project.urls]
Homepage = "https://github.com/perseverancesworld-web/QUANTAURA-Core"
Documentation = "https://github.com/perseverancesworld-web/QUANTAURA-Core/tree/main/docs"
Issues = "https://github.com/perseverancesworld-web/QUANTAURA-Core/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["quantaura*"]
exclude = ["tests*", "examples*", "site*"]

[tool.black]
line-length = 100
target-version = ["py310", "py311", "py312"]

[tool.ruff]
line-length = 100
target-version = "py310"
select = ["E", "F", "I", "N", "W"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["."]
asyncio_mode = "auto"
