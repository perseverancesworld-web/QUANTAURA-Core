[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "quantaura-core"
version = "0.1.0"
description = "Unified research OS + Execution Authorization Kernel: cryptographic intent signing, policy evaluation, and linear state machine for AI agent actions."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
  { name = "Joshua Privett", email = "joshua@perseverances.world" }
]
keywords = [
  "agi",
  "authorization",
  "intent",
  "crypto",
  "policy",
  "state-machine",
  "quant",
  "simulation",
  "cognitive-architecture",
  "fractal-intelligence",
  "research-os",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]

dependencies = [
  "fastapi>=0.100.0",
  "uvicorn[standard]>=0.20.0",
  "pydantic>=2.0.0",
  "pynacl>=1.5.0",
  "httpx>=0.27.0",
  "numpy>=1.26.0",
  "pandas>=2.2.0",
]

[project.optional-dependencies]
dev = [
  "black>=24.0.0",
  "pytest>=8.0.0",
  "pytest-asyncio>=0.23.0",
  "mkdocs-material>=9.0.0",
  "ruff>=0.9.0",
]

[project.scripts]
quantaura-serve = "quantaura.api.main:cli_serve"

[tool.setuptools.packages.find]
where = ["."]
include = ["quantaura*"]
exclude = ["tests*", "examples*"]

[tool.black]
line-length = 100
target-version = ["py310", "py311", "py312"]

[tool.ruff]
line-length = 100
target-version = "py310"
select = ["E", "F", "I", "N", "W"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["."]
asyncio_mode = "auto"
