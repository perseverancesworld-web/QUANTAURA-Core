services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: quantaura-api
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
    profiles:
      - prod

  api-dev:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: quantaura-api-dev
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    environment:
      - PYTHONUNBUFFERED=1
    command: ["quantaura-serve", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    profiles:
      - dev
