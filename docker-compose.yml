services:
  api-dev:
    build:
      context: .
      target: development
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    environment:
      QUANTAURA_LEDGER_PATH: /tmp/quantaura_ledger.db
      QUANTAURA_ENV: development
      QUANTAURA_POLICY_PACK: configs/policy_packs/default.yaml
    profiles: ["dev"]
    command: quantaura-serve --host 0.0.0.0 --port 8000 --reload

  api-prod:
    build:
      context: .
      target: production
    ports:
      - "8000:8000"
    environment:
      QUANTAURA_ENV: production
      QUANTAURA_LEDGER_PATH: /data/ledger.db
      QUANTAURA_POLICY_PACK: configs/policy_packs/enterprise.yaml
      QUANTAURA_API_KEYS: ${QUANTAURA_API_KEYS:-}
      QUANTAURA_RATE_LIMIT_PER_MIN: ${QUANTAURA_RATE_LIMIT_PER_MIN:-120}
      QUANTAURA_REQUIRE_SIGNATURE: ${QUANTAURA_REQUIRE_SIGNATURE:-false}
    volumes:
      - quantaura-data:/data
    profiles: ["prod"]
    restart: unless-stopped

  api-demo:
    build:
      context: .
      target: production
    ports:
      - "8000:8000"
    environment:
      QUANTAURA_ENV: demo
      QUANTAURA_LEDGER_PATH: /tmp/demo_ledger.db
      QUANTAURA_POLICY_PACK: configs/policy_packs/default.yaml
      QUANTAURA_RATE_LIMIT_PER_MIN: "60"
    profiles: ["demo"]
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: quantaura
      POSTGRES_PASSWORD: quantaura
      POSTGRES_DB: quantaura
    ports:
      - "5432:5432"
    profiles: ["postgres"]
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
  quantaura-data:
