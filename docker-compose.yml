services:
  api-dev:
    build:
      context: .
      target: development
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    environment:
      - QUANTAURA_LEDGER_PATH=/tmp/quantaura_ledger.db
    profiles: ["dev"]
    command: quantaura-serve --host 0.0.0.0 --port 8000 --reload

  api-prod:
    build:
      context: .
      target: production
    ports:
      - "8000:8000"
    profiles: ["prod"]

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: quantaura
      POSTGRES_PASSWORD: quantaura
      POSTGRES_DB: quantaura
    ports:
      - "5432:5432"
    profiles: ["postgres"]
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
