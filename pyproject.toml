[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "quantaura-core"
version = "0.5.0"
description = "Agent Execution Authorization Kernel + QPIE Physical Intelligence Engine."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Joshua Privett", email = "joshua@perseverances.world" }]
dependencies = [
  "fastapi>=0.100.0", "uvicorn[standard]>=0.20.0", "pydantic>=2.0.0",
  "pynacl>=1.5.0", "httpx>=0.27.0", "numpy>=1.26.0", "pandas>=2.2.0",
]

[project.optional-dependencies]
dev = ["black>=24.0.0", "pytest>=8.0.0", "pytest-asyncio>=0.23.0", "mkdocs-material>=9.0.0", "ruff>=0.9.0", "pyyaml>=6.0", "scipy>=1.11.0"]
langchain = ["langchain-core>=0.2.0"]
yaml = ["pyyaml>=6.0"]
sci = ["scipy>=1.11.0"]
postgres = ["psycopg[binary]>=3.1.0"]

[project.scripts]
quantaura-serve = "quantaura.api.main:cli_serve"

[tool.setuptools.packages.find]
where = ["."]
include = ["quantaura*"]
exclude = ["tests*", "examples*", "site*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["."]
asyncio_mode = "auto"
