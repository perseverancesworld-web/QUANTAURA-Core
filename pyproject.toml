[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "quantaura-core"
version = "0.4.0"
description = "Agent Execution Authorization Kernel + QPIE Physical Intelligence Engine for emergent physics discovery."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
  { name = "Joshua Privett", email = "joshua@perseverances.world" }
]
keywords = [
  "agent-authorization",
  "ai-agents",
  "control-plane",
  "physical-intelligence",
  "gauge-theory",
  "topology",
  "discrete-exterior-calculus",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Security",
  "Topic :: Scientific/Engineering :: Physics",
]

dependencies = [
  "fastapi>=0.100.0",
  "uvicorn[standard]>=0.20.0",
  "pydantic>=2.0.0",
  "pynacl>=1.5.0",
  "httpx>=0.27.0",
  "numpy>=1.26.0",
  "pandas>=2.2.0",
]

[project.optional-dependencies]
dev = [
  "black>=24.0.0",
  "pytest>=8.0.0",
  "pytest-asyncio>=0.23.0",
  "mkdocs-material>=9.0.0",
  "ruff>=0.9.0",
]
langchain = ["langchain-core>=0.2.0"]
postgres = ["psycopg[binary]>=3.1.0"]

[project.scripts]
quantaura-serve = "quantaura.api.main:cli_serve"

[project.urls]
Homepage = "https://github.com/perseverancesworld-web/QUANTAURA-Core"

[tool.setuptools.packages.find]
where = ["."]
include = ["quantaura*"]
exclude = ["tests*", "examples*", "site*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["."]
asyncio_mode = "auto"
